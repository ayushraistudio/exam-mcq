<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Exam Portal</title>
<style>body {
    background: #f4f6f8;
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    padding: 0;
}

h1 {
    color: #2051e5;
    text-align: center;
    margin-top: 30px;
}

.admin-section {
    background: #fff;
    max-width: 680px;
    margin: 32px auto;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(40,50,80,0.08);
    padding: 38px 36px 28px 36px;
}

.admin-section h2 {
    color: #3b3e53;
    margin-top: 36px;
    margin-bottom: 18px;
}

input, select, button {
    margin: 10px 6px 18px 0;
    padding: 12px 12px;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    font-size: 15px;
}

button {
    background: #2051e5;
    color: #fff;
    border: none;
    cursor: pointer;
    transition: background 0.18s;
}

button:hover {
    background: #1332a0;
}

hr {
    border: none;
    border-top: 2px solid #d6dce5;
    margin: 35px 0;
}

table {
    margin-top: 15px;
    width: 100%;
    border-collapse: collapse;
    background: #f1f3f9;
    border-radius: 6px;
    overflow: hidden;
}

th, td {
    padding: 13px;
    text-align: center;
    border-bottom: 1px solid #ececec;
}

th {
    background: #2051e5;
    color: #fff;
    font-weight: 600;
}

tr:nth-child(even) {
    background-color: #e7eaf6;
}
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="admin.js" defer></script>
</head>
<body>
<h1>Admin Panel - Exam Portal</h1>

<div class="admin-section">

  <h2>Add New Student</h2>
  <input type="text" id="studentEmail" placeholder="Student Email">
  <input type="password" id="studentPassword" placeholder="Student Password">
  <button id="addStudentBtn">Add Student</button>
  <div id="addStudentMsg" style="color:green;"></div>

  <hr>

  <h2>Add Question</h2>
  <input type="text" id="questionText" placeholder="Enter question">
  <input type="text" id="optionA" placeholder="Option A">
  <input type="text" id="optionB" placeholder="Option B">
  <input type="text" id="optionC" placeholder="Option C">
  <input type="text" id="optionD" placeholder="Option D">
  <select id="correctOption">
    <option value="">Select Correct Option</option>
    <option value="A">A</option>
    <option value="B">B</option>
    <option value="C">C</option>
    <option value="D">D</option>
  </select>
  <button id="addQuestionBtn">Add Question</button>
  <div id="addQuestionMsg" style="color:green;"></div>

  <hr>

  <h2>Exam Controls</h2>
  <button id="startExamBtn">Start Exam</button>
  <button id="endExamBtn">End Exam</button>
  <div id="examStatusMsg" style="color:blue;"></div>

  <hr>

  <h2>Leaderboard</h2>
  <table border="1" id="leaderboardTable">
    <thead>
      <tr>
        <th>Username</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="leaderboardBody">
      <!-- Leaderboard data populated here -->
    </tbody>
  </table>
<div style="display: flex; justify-content:  align-items: flex-start;">
  <div style="flex: 1;">
    
  </div>
  <div>
    <button id="studentExamBtn" style="background: #2563eb; color: #fff; border-radius: 7px; font-size: 1rem; font-weight: 500; height: 45px; min-width: 170px; box-shadow: 0 2px 6px #1e293b19; padding: 0 20px; border: none; cursor: pointer;" onclick="window.location.href='student.html'">Student Exam Section</button>
  </div>
</div>
</div>
</body>
</html>
